<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MeTrack · Division for Asia and the Pacific</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231f3a68%22/%3E%3Cpath d=%22M7 23V9l9 9 9-9v14%22 fill=%22none%22 stroke=%22white%22 stroke-width=%223%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --plane:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efec;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
  --brand:#1f3864; --on-brand:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --track:#e7e6e1; --chip:#eef2f8; --focus:#2a78d6; --shadow:rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --brand:#9db8e8; --on-brand:#0d0d0d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --track:#26261f; --chip:#22262e; --focus:#3987e5; --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
  --brand:#9db8e8; --on-brand:#0d0d0d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --track:#26261f; --chip:#22262e; --focus:#3987e5; --shadow:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink);min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hidden{display:none !important}
.muted{color:var(--ink-muted);font-size:13px}
a{color:var(--s1)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lcard{width:min(440px,100%);background:var(--surface);border:1px solid var(--ring);border-radius:16px;
  padding:30px 30px 24px;box-shadow:0 10px 40px var(--shadow)}
.lbrand{font-size:26px;font-weight:700;letter-spacing:-0.02em;margin:0}
.lsub{color:var(--ink-muted);font-size:14px;margin:2px 0 24px}
.lcard label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.lcard select,.lcard input{width:100%;padding:11px 12px;border:1px solid var(--axis);border-radius:9px;background:var(--surface);margin-bottom:16px;font-size:15px}
:root[data-theme="dark"] .lcard select,:root[data-theme="dark"] .lcard input{background:var(--surface-2)}
#lcode{text-transform:uppercase;letter-spacing:.12em;font-family:ui-monospace,Menlo,monospace}
.lbtn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--brand);color:var(--on-brand);font-weight:650;font-size:15px;cursor:pointer}
.lbtn:disabled{opacity:.5;cursor:not-allowed}
.lerr{color:var(--crit);font-size:13.5px;min-height:20px;margin:10px 0 0}
.lfoot{font-size:12.5px;color:var(--ink-muted);margin-top:14px;border-top:1px solid var(--grid);padding-top:12px}
.demo-note{background:var(--chip);border:1px dashed var(--brand);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--ink-2);margin:0 0 16px}
.demo-note b{font-family:ui-monospace,Menlo,monospace;color:var(--ink);letter-spacing:.06em}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--grid)}
.topin{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-0.02em;font-size:18px;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--ink-muted);letter-spacing:0;margin-top:-3px}
.demo-badge{font-size:11px;font-weight:700;color:var(--serious);border:1px solid var(--serious);border-radius:999px;padding:1px 8px;white-space:nowrap}
nav{display:flex;gap:3px;margin-left:18px;flex-wrap:wrap}
nav button{background:none;border:none;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-size:14.5px;font-weight:560}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--brand);color:var(--on-brand)}
.topright{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.who{font-size:13px;line-height:1.25;text-align:right;max-width:230px}
.who b{display:block;font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--ink-muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.iconbtn:hover{color:var(--ink)}
@media (max-width:640px){.top{position:static}.topin{padding:10px 16px;gap:8px}nav{margin-left:0;width:100%}nav button{padding:8px 11px}.topright{margin-left:0;width:100%;flex-wrap:nowrap}.topright #reportbtn{display:none}.who{text-align:left;flex:1;min-width:0;max-width:none}}
.btn{background:var(--brand);color:var(--on-brand);border:none;border-radius:9px;padding:10px 20px;font-size:14px;font-weight:620;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--axis)}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--crit);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

.wrap{max-width:1320px;margin:0 auto;padding:26px 20px 100px}
h1{font-size:25px;margin:0 0 4px;letter-spacing:-0.02em;font-weight:680}
.sub{color:var(--ink-2);margin:0 0 20px;max-width:80ch;font-size:14.5px}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pagehead .sub{margin:0}

/* ---------- form ---------- */
.cols{display:grid;grid-template-columns:1fr 310px;gap:20px;align-items:start}
@media (max-width:1050px){.cols{grid-template-columns:1fr}}
.fieldset{border:none;padding:0;margin:0 0 26px}
.legend{display:flex;align-items:center;gap:9px;margin:0 0 4px;flex-wrap:wrap}
.legend .n{width:22px;height:22px;border-radius:7px;background:var(--brand);color:var(--on-brand);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.legend h3{margin:0;font-size:16px;font-weight:640}
.legend .when{font-size:11.5px;color:var(--serious);border:1px solid var(--ring);border-radius:999px;padding:1px 8px;font-weight:600}
.legend-help{font-size:13px;color:var(--ink-muted);margin:0 0 12px 31px;max-width:82ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.f label{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.req{color:var(--crit);font-size:11px;font-weight:700}
.opt{color:var(--ink-muted);font-size:11px;font-weight:500}
.f .hint{font-size:12px;color:var(--ink-muted);line-height:1.4}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
  background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 11px;width:100%}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:var(--surface-2)}
textarea{resize:vertical;min-height:74px;line-height:1.5}
select{cursor:pointer}
.wordcount{font-size:11.5px;color:var(--ink-muted);text-align:right}
.wordcount.bad{color:var(--crit);font-weight:600}
.wordcount.ok{color:var(--good);font-weight:600}

.picker{border:1px solid var(--axis);border-radius:8px;background:var(--surface);padding:7px}
:root[data-theme="dark"] .picker{background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--ring);border-radius:999px;padding:2px 6px 2px 9px;font-size:12.5px;font-weight:560}
.chip b{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--brand);font-weight:700}
.chip button{background:none;border:none;cursor:pointer;color:var(--ink-muted);font-size:15px;line-height:1;padding:0 2px}
.chip button:hover{color:var(--crit)}
.picker input{border:none;padding:5px 4px;background:none}
.picker input:focus{outline:none}
.opts{max-height:190px;overflow:auto;border-top:1px solid var(--grid);margin-top:6px;padding-top:5px}
.opt-row{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.opt-row:hover{background:var(--surface-2)}
.opt-row .iso{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink-muted)}

.segrow{display:grid;grid-template-columns:130px 1fr 1.05fr 1fr 1.15fr;gap:8px;align-items:center;margin-bottom:9px}
@media (max-width:860px){.segrow{grid-template-columns:1fr 1fr}}
.seghead{margin-bottom:4px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
@media (max-width:860px){.seghead{display:none}}
.segrow .sl{font-size:13px;font-weight:560;color:var(--ink-2)}
.rep{border:1px solid var(--ring);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--surface-2)}
.rep .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rep .rh span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.linkbtn{background:none;border:none;color:var(--s1);cursor:pointer;font-size:13px;font-weight:600;padding:0}
.linkbtn.danger{color:var(--crit)}
.addbtn{background:var(--surface);border:1px dashed var(--axis);border-radius:9px;padding:9px 14px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);width:100%}
.addbtn:hover{border-color:var(--s1);color:var(--s1)}
.togs{display:flex;gap:7px;flex-wrap:wrap}
.tog{border:1px solid var(--axis);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;background:var(--surface);font-weight:550;white-space:nowrap}
:root[data-theme="dark"] .tog{background:var(--surface-2)}
.tog[aria-pressed="true"],:root[data-theme="dark"] .tog[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.tog.partial,:root[data-theme="dark"] .tog.partial{background:var(--chip);color:var(--brand);border-color:var(--brand);border-style:dashed}
.dagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.dagrid .tog{padding:4px 0;text-align:center;font-size:12.5px}

.rail{position:sticky;top:80px}
.rail .card{padding:16px 18px}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.checklist .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--axis);flex:none;margin-top:3px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.checklist li.done .bx{background:var(--good);border-color:var(--good)}
.checklist li.done span{color:var(--ink-2)}
.checklist li.need .bx{border-color:var(--crit)}
.checklist li.need span{color:var(--crit);font-weight:560}
.progress{height:6px;background:var(--track);border-radius:999px;margin:4px 0 12px;overflow:hidden}
.progress i{display:block;height:6px;background:var(--good);border-radius:999px;transition:width .2s}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--ring);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;white-space:nowrap;background:var(--surface-2);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:640;padding:1px 9px;border-radius:999px;border:1px solid var(--ring);white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.imp{color:var(--s1)} .pill.comp{color:var(--good)} .pill.hold{color:var(--serious)} .pill.plan{color:var(--ink-muted)}
.tagpill{display:inline-block;font-size:11px;font-weight:640;padding:1px 8px;border-radius:999px;border:1px solid var(--ring);background:var(--chip);color:var(--brand);margin:0 3px 3px 0;white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.idcell{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--brand);font-weight:600;white-space:nowrap}
.lock{font-size:11.5px;color:var(--ink-muted);white-space:nowrap}

.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:13px 16px;margin-bottom:12px}
.filterbar .fb{display:flex;flex-direction:column;gap:4px}
.filterbar label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);font-weight:700}
.filterbar select,.filterbar input{padding:6px 9px;border-radius:7px;font-size:13px;min-width:120px}
.filterbar .grow{flex:1;min-width:190px}
.colpick{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.colpick .cc{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- dashboard ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px 18px}
.tile .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);font-weight:700}
.tile .v{font-size:30px;font-weight:660;letter-spacing:-0.03em;line-height:1.1;margin:7px 0 2px}
.tile .t{font-size:12.5px;color:var(--ink-2)}
.meter{height:6px;background:var(--track);border-radius:999px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:6px;border-radius:999px;background:var(--s1)}
.meter i.ok{background:var(--good)} .meter i.warn{background:var(--serious)}
.bars{display:grid;grid-template-columns:minmax(84px,auto) 1fr auto;gap:5px 12px;align-items:center}
.bl{font-size:12.5px;color:var(--ink-2);text-align:right}
.btrack{background:var(--track);border-radius:4px;height:16px}
.bfill{height:16px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bval{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:26px}
.qgrid{display:grid;grid-template-columns:minmax(40px,auto) 1fr auto;gap:10px 12px;align-items:center}
.qpair{display:flex;flex-direction:column;gap:2px}
.qbar{height:13px;border-radius:0 4px 4px 0;min-width:2px}
.qbar.plan{background:var(--s1)} .qbar.act{background:var(--s2)}
.legrow{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-bottom:13px;flex-wrap:wrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.plan{background:var(--s1)} .sw.act{background:var(--s2)}
.banner{background:var(--chip);border:1px solid var(--ring);border-left:3px solid var(--s3);border-radius:0 10px 10px 0;padding:11px 16px;margin-bottom:16px;font-size:13.5px;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:150;display:none}
.scrim.open{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(760px,96vw);background:var(--plane);z-index:160;overflow-y:auto;
  transform:translateX(100%);transition:transform .22s ease;box-shadow:-8px 0 30px var(--shadow)}
.panel.open{transform:none}
.panel .ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--grid);padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:2}
.panel .pb{padding:20px 22px 60px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:7px 16px;font-size:13.5px}
@media (max-width:600px){.kv{grid-template-columns:1fr}}
.kv dt{color:var(--ink-muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.sec{margin-top:22px}
.sec h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--grid)}
.ms{border-left:2px solid var(--grid);padding:0 0 0 13px;margin-bottom:12px}
.ms b{font-size:13.5px}
.ms p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.dl{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--grid)}
.dl:last-child{border-bottom:none}
.dl .ic{width:26px;height:26px;border-radius:6px;background:var(--chip);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--brand);flex:none}
.dl a{text-decoration:none;overflow-wrap:anywhere}
.dl a:hover{text-decoration:underline}
.modal{position:fixed;z-index:170;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);
  background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:22px 24px;box-shadow:0 20px 60px var(--shadow)}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .row{display:flex;gap:10px;align-items:center;margin:16px 0}
.modal select{max-width:260px}
.stat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:6px 0 16px}
.stat b{font-variant-numeric:tabular-nums;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--brand);color:var(--on-brand);
  padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600;z-index:200;max-width:min(680px,92vw);text-align:center;
  box-shadow:0 8px 26px var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.err{background:var(--crit);color:#fff}
.loading{padding:60px 0;text-align:center;color:var(--ink-muted)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--axis);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.top,.scrim,.panel,.toast{display:none}}
</style>
</head>
<body>

<!-- ===================================================== LOGIN -->
<div class="login" id="login">
  <div class="lcard">
    <p class="lbrand">MeTrack</p>
    <p class="lsub">Division for Asia and the Pacific · project monitoring</p>
    <div id="ldemo" class="demo-note hidden"></div>
    <label for="luser">Who are you?</label>

const TOOLS=[["T01","WIPO NIPS methodology"],["T02","WIPO Guides for businesses and start-ups"],["T03","WIPO IP Diagnostics Tool"],["T04","IP toolkit for universities"],["T05","IP and Tourism toolkit"],["T06","Gender analysis guidelines"],["T07","Toolkit: innovation ecosystems ready for AI"],["T08","WIPO Guide on Generative AI"],["T09","Creative Economy Data Model"],["T10","New Product Development toolkit"],["T11","Collective Management toolkit"],["T12","Global Innovation Index use"],["T13","Cultural Heritage access toolkits"]];
const IPTYPE=[["TRADEMARK","Trademark"],["PATENT","Patent"],["DESIGN","Industrial design"],["GI","Geographical indication"],["COLLECTIVE","Collective mark"],["COPYRIGHT","Copyright"],["UTILITY","Utility model"]];

const MSTATUS=[["PLANNED","Planned"],["IN_PROGRESS","In progress"],["ACHIEVED","Achieved"],["DELAYED","Delayed"],["CANCELLED","Cancelled"]];
const DOCTYPES=[["PROJECT_DOC","Project document"],["CONCEPT","Concept note"],["COMPLETION","Completion report"],["EVALUATION","Evaluation report"],["WORKPLAN","Workplan extract"],["PHOTO","Photographs"],["OTHER","Other"]];
const L=Object.fromEntries([["type",TYPES],["er",ER],["status",STATUS],["doc",DOCSTAGE],["fund",FUNDING],["theme",THEMES],["seg",SEGMENTS],["ent",ENTITY_TYPE],["q",QUALIFIER],["rs",RSTATUS],["tool",TOOLS],["ip",IPTYPE],["ipst",IPSTAGE],["ms",MSTATUS],["dt",DOCTYPES],["bucket",BUCKETS]].map(([k,v])=>[k,Object.fromEntries(v)]));
const WORKPLAN_YEARS=(()=>{const y=new Date().getFullYear();return [y-2,y-1,y,y+1,y+2].map(String);})();
const DESC_TEMPLATE="Context: the problem or opportunity in the beneficiary country, in one or two sentences.\n\nWhat the project does: the main activities, in the order they happen.\n\nWho benefits: the specific group, with numbers where known.\n\nExpected result: what will be different when the project closes, stated so it can be checked.";
function requiredDocs(status){
  return {NOT_STARTED:["CONCEPT"],IN_PROGRESS:["PROJECT_DOC"],COMPLETED:["PROJECT_DOC","COMPLETION"],ON_HOLD:["PROJECT_DOC"]}[status]||[];
}

/* ------------------------------------------------------------ utilities */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pad=n=>String(n).padStart(2,"0");
const fmt=n=>Number(n||0).toLocaleString("en-US");
const words=s=>String(s||"").trim().split(/\s+/).filter(Boolean).length;
const clone=o=>JSON.parse(JSON.stringify(o));
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function todayISO(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function nowStamp(){const d=new Date();return todayISO()+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+"."+String(d.getMilliseconds()).padStart(3,"0");}
const quarterOf=d=>d?d.slice(0,4)+"-Q"+Math.ceil(+d.slice(5,7)/3):null;
function qRange(q){const y=+q.slice(0,4),n=+q.slice(-1),sm=(n-1)*3+1,em=n*3;return[`${y}-${pad(sm)}-01`,`${y}-${pad(em)}-${pad(new Date(Date.UTC(y,em,0)).getUTCDate())}`];}
function qLabel(q){const y=q.slice(0,4),n=+q.slice(-1);return `Quarter ${n}, ${MONTHS[(n-1)*3]} to ${MONTHS[n*3-1]} ${y}`;}
const qShort=q=>"Q"+q.slice(-1)+" "+q.slice(0,4);
function qShift(q,k){let y=+q.slice(0,4),n=+q.slice(-1)-1+k;y+=Math.floor(n/4);n=((n%4)+4)%4;return y+"-Q"+(n+1);}
function niceDate(d){if(!d)return "";const [y,m,dd]=d.split("-");return `${+dd} ${MONTHS[+m-1]} ${y}`;}
function niceRange(a,b){if(!b||a===b)return niceDate(a);const [y1,m1,d1]=a.split("-"),[y2,m2,d2]=b.split("-");
  if(y1===y2&&m1===m2)return `${+d1} to ${+d2} ${MONTHS[+m1-1]} ${y1}`;
  if(y1===y2)return `${+d1} ${MONTHS[+m1-1]} to ${+d2} ${MONTHS[+m2-1]} ${y1}`;
  return `${niceDate(a)} to ${niceDate(b)}`;}
const CUR_Q=quarterOf(todayISO());
function spendAt(r,q){const h=(r.spend||[]).slice().sort((a,b)=>a.p.localeCompare(b.p));let v=0;h.forEach(x=>{if(!q||x.p<=q)v=Number(x.a||0);});return v;}
const latestSpend=r=>spendAt(r,null);
function total(r,seg){return (r.benef||[]).filter(b=>b.seg===seg&&b.rs==="REPORTED").reduce((a,b)=>a+Number(b.n||0),0);}
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.classList.toggle("err",!!err);t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),err?6000:3600);}
const normCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const uname=id=>(USERS.find(u=>u.id===id)||{}).name||id||"";
const store={get(k){try{return JSON.parse(sessionStorage.getItem(k));}catch(e){return null;}},
  set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{sessionStorage.removeItem(k);}catch(e){}}};

/* ------------------------------------------------------ validation rules
   Same rules as the backend (Code.gs validate_). */
function requirements(r,all){
  const d=/^\d{4}-\d{2}-\d{2}$/;
  const items=[
    ["Record type"+(r.type==="COMPONENT"?" and parent project":""), !!r.type&&(r.type!=="COMPONENT"||all.some(p=>p.id===r.parentId&&p.id!==r.id))],
    ["Expected Result", !!r.er],
    ["Working title", !!String(r.title||"").trim()],
  ];
  if(r.inWorkplan) items.push(["Workplan title and year", !!String(r.workplanTitle||"").trim()&&!!r.workplanYear]);
  items.push(
    ["Status", !!r.status],
    ["Funding source"+(r.funding==="OTHER"?" (which one)":""), !!r.funding&&(r.funding!=="OTHER"||!!String(r.fundingOther||"").trim())],
    ["Project manager", !!r.managerId],
    ["A country or a regional grouping", (r.countries||[]).length>0||(r.groupings||[]).length>0],
    ["At least one area or topic", (r.themes||[]).length>0],
    ["Start date", d.test(r.start||"")],
    [r.status==="COMPLETED"?"End date":"Expected completion date", d.test((r.status==="COMPLETED"?r.end:r.expEnd)||"")],
    ["Allocated budget", r.budget!==""&&r.budget!=null&&!isNaN(Number(r.budget))&&Number(r.budget)>=0],
    ["Description", !!String(r.desc||"").trim()]);
  return items.map(([label,ok])=>({label,ok}));
}
const missing=(r,all)=>requirements(r,all).filter(x=>!x.ok).map(x=>x.label.toLowerCase());

/* ================================================================== API */
function ApiError(msg,code){const e=new Error(msg);e.code=code;return e;}

const RemoteApi={
  async call(body){
    let res;
    try{ res=await fetch(API_URL,{method:"POST",body:JSON.stringify(body),redirect:"follow"}); }
    catch(e){ throw ApiError("Could not reach the MeTrack server. Check your connection and try again.","NETWORK"); }
    let j; try{ j=await res.json(); }catch(e){ throw ApiError("The MeTrack server sent an unexpected reply. Check the apiUrl in config.js.","NETWORK"); }
    if(!j.ok) throw ApiError(j.error||"Request failed.",j.code);
    return j;
  },
  async users(){ return (await this.call({action:"users"})).users; },
  async login(userId,code){ return this.call({action:"login",userId,code}); },
  async list(token){ const j=await this.call({action:"list",token}); if(Array.isArray(j.users)&&j.users.length) USERS=j.users; return j.records; },
  async save(token,record,baseUpdatedAt){ return (await this.call({action:"save",token,record,baseUpdatedAt})).record; },
  async del(token,id){ return this.call({action:"delete",token,id}); },
  codeHint(){ return ""; },
};

/* Demo backend: the same rules as Code.gs, held in memory. */
const DemoApi=(()=>{
  const D=window.METRACK_DEMO||{users:[],records:[]};
  let recs=clone(D.records||[]);
  const who=t=>{const id=String(t||"").replace(/^demo\./,"");const u=(D.users||[]).find(x=>x.id===id);if(!u)throw ApiError("Please sign in again.","AUTH");return u;};
  const may=(u,r)=>u.admin||r.managerId===u.id||(r.team||[]).includes(u.id)||r.createdBy===u.id;
  const wait=v=>new Promise(res=>setTimeout(()=>res(v),120));
  return {
    users:()=>wait((D.users||[]).map(u=>({id:u.id,name:u.name,role:u.role}))),  // demo keeps roles; the real server sends them only after sign-in
    codeHint:id=>((D.users||[]).find(u=>u.id===id)||{}).code||"",
    async login(id,code){
      const u=(D.users||[]).find(x=>x.id===id);
      if(!u||normCode(code)!==normCode(u.code)) throw ApiError("That code is not right for this person.","AUTH");
      return wait({ok:true,token:"demo."+u.id,user:{id:u.id,name:u.name,role:u.role,admin:!!u.admin}});
    },
    async list(t){ who(t); return wait(clone(recs)); },
    async save(t,rec,base){
      const u=who(t); rec=clone(rec);
      const ex=rec.id?recs.find(r=>r.id===rec.id):null;
      if(rec.id&&!ex) throw ApiError("That record no longer exists.","INVALID");
      if(ex&&!may(u,ex)) throw ApiError("Only the project manager, named teammates and administrators can edit this record.","FORBIDDEN");
      if(ex&&base&&ex.updatedAt&&base!==ex.updatedAt) throw ApiError("Someone saved this record while you were editing. Reload and try again.","CONFLICT");
      const miss=missing(rec,recs); if(miss.length) throw ApiError("Still needed: "+miss.join(", ")+".","INVALID");
      if(rec.status!=="COMPLETED") rec.end="";
      if(rec.type!=="COMPONENT") rec.parentId="";
      rec.team=(rec.team||[]).filter(x=>x!==rec.managerId);
      rec.spend=ex?(ex.spend||[]):[];
      if(rec.spendNow!==""&&rec.spendNow!=null&&!isNaN(Number(rec.spendNow))) rec.spend=rec.spend.filter(s=>s.p!==CUR_Q).concat([{p:CUR_Q,a:Number(rec.spendNow)}]);
      delete rec.spendNow;
      rec.milestones=(rec.milestones||[]).filter(m=>String(m.name||"").trim());
      rec.docs=(rec.docs||[]).filter(d=>d.name||d.url);
      rec.tools=(rec.tools||[]).filter(x=>x.iso&&x.tool);
      if(ex){ rec.createdBy=ex.createdBy; }
      else {
        const tag=(rec.countries.length===1?rec.countries[0]:(rec.groupings[0]||rec.countries[0]||"REG"));
        const y=(rec.start||todayISO()).slice(0,4); let n=1;
        while(recs.some(r=>r.id===`DAP-${y}-${tag}-${pad(n)}`)) n++;
        rec.id=`DAP-${y}-${tag}-${pad(n)}`; rec.createdBy=u.id;
      }
      rec.updatedBy=u.id; rec.updatedAt=nowStamp();
      if(ex) recs[recs.indexOf(ex)]=rec; else recs.push(rec);
      return wait(clone(rec));
    },
    async del(t,id){
      const u=who(t); if(!u.admin) throw ApiError("Only administrators can delete records.","FORBIDDEN");
      recs=recs.filter(r=>r.id!==id); return wait({ok:true});
    },
  };
})();
const Api=DEMO?DemoApi:RemoteApi;

/* ================================================================ STATE */
let USERS=[], ME=null, TOKEN=null, DB=[], LOADED_AT=null;
let VIEW="form", editing=null, draft=null, viewing=null;
const canEdit=r=>!!ME&&(ME.admin||r.managerId===ME.id||(r.team||[]).includes(ME.id)||r.createdBy===ME.id);
const rec=id=>DB.find(r=>r.id===id);

function handleErr(e){
  if(e.code==="AUTH"){ signOut(e.message); return; }
  toast(e.message||"Something went wrong.",true);
  if(e.code==="CONFLICT") refresh();
}

/* ================================================================ LOGIN */
async function boot(){
  applyTheme();
  if(DEMO){
    $("#demobadge").classList.remove("hidden");
    if(!window.METRACK_DEMO){ $("#lerr").textContent="Not connected yet. Paste the Apps Script web app URL into config.js (README, step 10)."; return; }
  }
  try{ USERS=await Api.users(); }
  catch(e){ $("#luser").innerHTML='<option value="">Unavailable</option>'; $("#lerr").textContent=e.message; return; }
  const sel=$("#luser");
  sel.innerHTML='<option value="">Choose your name</option>'+USERS.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join("");
  const s=store.get("metrack.session");
  if(s&&s.token&&s.user&&(DEMO?String(s.token).startsWith("demo."):!String(s.token).startsWith("demo."))){
    TOKEN=s.token; ME=s.user;
    try{ await enterApp(); return; }catch(e){ TOKEN=null; ME=null; store.del("metrack.session"); }
  }
  showLogin();
}
function showLogin(msg){
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
  $("#lerr").textContent=msg||""; $("#lcode").value=""; updateLoginBtn(); updateDemoNote();
}
function updateLoginBtn(){ $("#lgo").disabled=!($("#luser").value&&normCode($("#lcode").value).length>=6); }
function updateDemoNote(){
  const n=$("#ldemo"); if(!DEMO){n.classList.add("hidden");return;}
  const id=$("#luser").value; n.classList.remove("hidden");
  n.innerHTML=id?`Demo mode, nothing is saved. Code for ${esc(uname(id))}: <b>${esc(Api.codeHint(id))}</b>`
    :"Demo mode, nothing is saved. Choose a name to see its demo code.";
}
$("#luser").onchange=()=>{updateLoginBtn();updateDemoNote();$("#lerr").textContent="";};
$("#lcode").oninput=updateLoginBtn;
$("#lcode").onkeydown=e=>{if(e.key==="Enter"&&!$("#lgo").disabled)$("#lgo").click();};
$("#lgo").onclick=async()=>{
  const b=$("#lgo"); b.disabled=true; b.textContent="Signing in…"; $("#lerr").textContent="";
  try{
    const r=await Api.login($("#luser").value,$("#lcode").value);
    TOKEN=r.token; ME=r.user; store.set("metrack.session",{token:TOKEN,user:ME});
    await enterApp();
  }catch(e){ $("#lerr").textContent=e.message; }
  finally{ b.textContent="Sign in"; updateLoginBtn(); }
};
async function enterApp(){
  DB=await Api.list(TOKEN); LOADED_AT=new Date();
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#who").innerHTML=`<b>${esc(ME.name)}${ME.admin?" · admin":""}</b><span>${esc(ME.role||"")}</span>`;
  draft=null; editing=null; go("form");
}
function signOut(msg){
  TOKEN=null; ME=null; DB=[]; draft=null; editing=null; store.del("metrack.session"); closePanel(); closeModal();
  showLogin(msg);
}
$("#signout").onclick=()=>signOut();
async function refresh(){
  try{ DB=await Api.list(TOKEN); LOADED_AT=new Date(); if(VIEW!=="form") go(VIEW); }catch(e){ handleErr(e); }
}

/* ================================================================= FORM */
function blank(){return {id:"",type:"PROJECT",parentId:"",er:"",buckets:[],copyright:false,title:"",inWorkplan:false,workplanTitle:"",workplanYear:"",
  desc:"",managerId:ME?ME.id:"",team:[],counterpart:"",countries:[],groupings:[],status:"",docStage:"NONE",funding:"",fundingOther:"",
  start:"",end:"",expEnd:"",budget:"",spendNow:"",themes:[],docs:[],benef:[{seg:"TOTAL",n:"",ent:"INDIVIDUAL",q:"EXACT",rs:"REPORTED"}],
  milestones:[],tools:[],satisfaction:"",respondents:"",filings:[],da:[],sustainability:""};}
function sel(key,list,val,ph){return `<select data-k="${key}"><option value="">${ph||"Select…"}</option>`+list.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`).join("")+"</select>";}
function groupState(d,code){const g=GRP[code];const n=g.members.filter(m=>d.countries.includes(m)).length;return n===0?"off":n===g.members.length?"full":"partial";}

function renderForm(){
  if(!draft){
    if(editing){ const r=rec(editing); draft=Object.assign(blank(),clone(r)); draft.spendNow=latestSpend(r)?String(latestSpend(r)):""; draft._base=r.updatedAt||""; }
    else draft=blank();
  }
  const d=draft, isNew=!editing;
  const parents=DB.filter(r=>r.type!=="COMPONENT"&&r.id!==d.id);
  $("#v-form").innerHTML=`

function buildGroups(){
  const d=draft; $("#grptogs").innerHTML=GROUPINGS.map(g=>{const st=groupState(d,g.code);const n=g.members.filter(m=>d.countries.includes(m)).length;
    return `<button type="button" class="tog ${st==="partial"?"partial":""}" data-grp="${g.code}" aria-pressed="${st==="full"}">${esc(st==="partial"?`${g.label} (${n} of ${g.members.length})`:g.label)}</button>`;}).join("");
}
function buildPicker(){
  const d=draft, host=$("#cpick");
  $("#creq").textContent=d.groupings.length?"optional when a grouping is picked":"required";
  host.innerHTML=`<div class="picker"><div class="chips">${d.countries.map(c=>`<span class="chip"><b>${c}</b>${esc(CNAME[c]||c)}<button type="button" data-rmc="${c}" aria-label="Remove ${esc(CNAME[c]||c)}">×</button></span>`).join("")||'<span class="muted" style="padding:3px 4px">No country selected</span>'}</div>
    <input type="text" id="csearch" placeholder="Type a country name or ISO code…" aria-label="Add a country"><div class="opts hidden" id="copts"></div></div>`;
  const inp=$("#csearch"),opts=$("#copts");
  const draw=q=>{const list=COUNTRIES.filter(c=>!d.countries.includes(c.iso)&&(!q||c.name.toLowerCase().includes(q)||c.iso.toLowerCase().includes(q)));
    opts.innerHTML=list.length?list.map(c=>`<div class="opt-row" data-addc="${c.iso}"><span>${esc(c.name)}</span><span class="iso">${c.iso}</span></div>`).join(""):'<div class="opt-row muted">No match in the Asia-Pacific list</div>';};
  inp.onfocus=()=>{opts.classList.remove("hidden");draw("");};
  inp.oninput=()=>draw(inp.value.trim().toLowerCase());
  inp.onblur=()=>setTimeout(()=>opts.classList.add("hidden"),180);
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const f=opts.querySelector("[data-addc]");if(f){d.countries.push(f.dataset.addc);buildPicker();buildGroups();refreshRail();$("#csearch").focus();}}};
  host.onmousedown=e=>{
    const a=e.target.closest("[data-addc]"); if(a){e.preventDefault();d.countries.push(a.dataset.addc);buildPicker();buildGroups();refreshRail();$("#csearch").focus();return;}
    const r=e.target.closest("[data-rmc]"); if(r){e.preventDefault();d.countries=d.countries.filter(x=>x!==r.dataset.rmc);
      d.groupings=d.groupings.filter(g=>groupState(d,g)!=="off");buildPicker();buildGroups();refreshRail();}
  };
}
function buildBenef(){
  const d=draft, want=["TOTAL"].concat(["WOMEN","YOUTH","SME","PWD","LOCAL_COMM"].filter(s=>d.themes.includes(s)));
  d.benef=want.map(s=>d.benef.find(b=>b.seg===s)||{seg:s,n:"",ent:"INDIVIDUAL",q:"EXACT",rs:"REPORTED"});
  $("#benefrows").innerHTML=`<div class="segrow seghead"><div></div><div>Number</div><div>Counted as</div><div>Precision</div><div>Status</div></div>`+d.benef.map((b,i)=>`<div class="segrow"><div class="sl">${esc(L.seg[b.seg])}</div>
    <input type="number" min="0" data-b="${i}" data-bk="n" value="${esc(b.n)}" placeholder="Number" aria-label="${esc(L.seg[b.seg])} number">
    <select data-b="${i}" data-bk="ent" aria-label="Counted as">${ENTITY_TYPE.map(([v,l])=>`<option value="${v}" ${v===b.ent?"selected":""}>${l}</option>`).join("")}</select>
    <select data-b="${i}" data-bk="q" aria-label="Precision">${QUALIFIER.map(([v,l])=>`<option value="${v}" ${v===b.q?"selected":""}>${l}</option>`).join("")}</select>
    <select data-b="${i}" data-bk="rs" aria-label="Reporting status">${RSTATUS.map(([v,l])=>`<option value="${v}" ${v===b.rs?"selected":""}>${l}</option>`).join("")}</select></div>`).join("");
}
function isoOpts(d,val){return `<option value="">Select…</option>`+(d.countries.length?d.countries:ALL_ISO).map(c=>`<option value="${c}" ${c===val?"selected":""}>${esc(CNAME[c]||c)}</option>`).join("");}
function buildRepeat(){
  const d=draft;
  $("#msrows").innerHTML=d.milestones.map((m,i)=>{const w=words(m.desc),need=m.st==="ACHIEVED",cls=!need?"":(w>=50&&w<=100?"ok":(w?"bad":""));
    return `<div class="rep"><div class="rh"><span>Milestone ${i+1}</span><button type="button" class="linkbtn danger" data-del="milestones" data-i="${i}">Remove</button></div>
    <div class="grid3"><div class="f" style="grid-column:span 2"><label>Milestone</label><input type="text" data-r="milestones" data-i="${i}" data-rk="name" value="${esc(m.name)}"></div>
    <div class="f"><label>Date</label><input type="date" data-r="milestones" data-i="${i}" data-rk="date" value="${esc(m.date)}"></div></div>
    <div class="f"><label>Status</label><select data-r="milestones" data-i="${i}" data-rk="st">${MSTATUS.map(([v,l])=>`<option value="${v}" ${v===m.st?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="f ${need?"":"hidden"}"><label>What was achieved <span class="req">50 to 100 words</span></label>
      <textarea data-r="milestones" data-i="${i}" data-rk="desc" placeholder="Goes word for word into the quarterly report annex.">${esc(m.desc)}</textarea>
      <div class="wordcount ${cls}" id="wc${i}">${w} words${need?(w<50?", "+(50-w)+" more needed":w>100?", "+(w-100)+" over the limit":", within the limit"):""}</div></div></div>`;}).join("");
  $("#toolrows").innerHTML=d.tools.map((t,i)=>`<div class="rep"><div class="rh"><span>Tool use ${i+1}</span><button type="button" class="linkbtn danger" data-del="tools" data-i="${i}">Remove</button></div>
    <div class="grid2"><div class="f"><label>Country</label><select data-r="tools" data-i="${i}" data-rk="iso">${isoOpts(d,t.iso)}</select></div>
    <div class="f"><label>Tool or methodology</label><select data-r="tools" data-i="${i}" data-rk="tool"><option value="">Select…</option>${TOOLS.map(([v,l])=>`<option value="${v}" ${v===t.tool?"selected":""}>${esc(l)}</option>`).join("")}</select></div></div></div>`).join("");
  $("#filrows").innerHTML=d.filings.map((f,i)=>`<div class="rep"><div class="rh"><span>Filing ${i+1}</span><button type="button" class="linkbtn danger" data-del="filings" data-i="${i}">Remove</button></div>
    <div class="grid2"><div class="f"><label>IP type</label><select data-r="filings" data-i="${i}" data-rk="type">${IPTYPE.map(([v,l])=>`<option value="${v}" ${v===f.type?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
    <div class="f"><label>Stage</label><select data-r="filings" data-i="${i}" data-rk="stage">${IPSTAGE.map(([v,l])=>`<option value="${v}" ${v===f.stage?"selected":""}>${esc(l)}</option>`).join("")}</select></div></div>
    <div class="grid2"><div class="f"><label>How many</label><input type="number" min="0" data-r="filings" data-i="${i}" data-rk="n" value="${esc(f.n)}"></div>
    <div class="f"><label>Country</label><select data-r="filings" data-i="${i}" data-rk="iso">${isoOpts(d,f.iso)}</select></div></div></div>`).join("");
  $("#docrows").innerHTML=d.docs.map((x,i)=>`<div class="rep"><div class="rh"><span>Document ${i+1}</span><button type="button" class="linkbtn danger" data-del="docs" data-i="${i}">Remove</button></div>
    <div class="grid2"><div class="f"><label>Document type</label><select data-r="docs" data-i="${i}" data-rk="type">${DOCTYPES.map(([v,l])=>`<option value="${v}" ${v===x.type?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
    <div class="f"><label>File name</label><input type="text" data-r="docs" data-i="${i}" data-rk="name" value="${esc(x.name)}" placeholder="As saved in SharePoint"></div></div>
    <div class="f"><label>SharePoint link</label><input type="url" data-r="docs" data-i="${i}" data-rk="url" value="${esc(x.url)}" placeholder="https://wipo.sharepoint.com/…"></div></div>`).join("");

function refreshRail(){
  const items=requirements(draft,DB), done=items.filter(x=>x.ok).length;
  $("#reqbox").innerHTML=`<div class="muted">${done} of ${items.length} done</div><div class="progress"><i style="width:${done/items.length*100}%"></i></div>
    <ul class="checklist">${items.map(x=>`<li class="${x.ok?"done":"need"}"><span class="bx">${x.ok?"✓":""}</span><span>${esc(x.label)}</span></li>`).join("")}</ul>`;
  const need=requiredDocs(draft.status), have=new Set(draft.docs.map(x=>x.type));
  $("#docchk").innerHTML=need.length?need.map(t=>`<li class="${have.has(t)?"done":"need"}"><span class="bx">${have.has(t)?"✓":""}</span><span>${esc(L.dt[t])}${have.has(t)?"":", missing"}</span></li>`).join(""):'<li class="muted">Choose a status first.</li>';
}
function wireForm(){
  const root=$("#v-form"), d=draft, RERENDER=["er","status","type","funding","managerId"];
  root.oninput=e=>{const t=e.target;
    if(t.dataset.k&&!RERENDER.includes(t.dataset.k)){d[t.dataset.k]=t.value;refreshRail();}
    if(t.dataset.b!==undefined){d.benef[+t.dataset.b][t.dataset.bk]=t.value;}
    if(t.dataset.r){d[t.dataset.r][+t.dataset.i][t.dataset.rk]=t.value;
      if(t.dataset.rk==="desc"){const m=d.milestones[+t.dataset.i],w=words(m.desc),el=$("#wc"+t.dataset.i);
        if(el){el.className="wordcount "+(w>=50&&w<=100?"ok":w?"bad":"");el.textContent=w+" words"+(w<50?", "+(50-w)+" more needed":w>100?", "+(w-100)+" over the limit":", within the limit");}}
      if(t.dataset.rk==="type")refreshRail();}
  };
  root.onchange=e=>{const t=e.target;
    if(t.dataset.k&&RERENDER.includes(t.dataset.k)){d[t.dataset.k]=t.value;if(t.dataset.k==="managerId")d.team=d.team.filter(x=>x!==t.value);renderForm();}
    if(t.dataset.r==="milestones"&&t.dataset.rk==="st"){d.milestones[+t.dataset.i].st=t.value;buildRepeat();}
    if(t.dataset.r==="docs")refreshRail();
  };
  root.onclick=e=>{
    const b=e.target.closest("[data-bool]"); if(b){d[b.dataset.bool]=b.dataset.v==="1";renderForm();return;}
    const g=e.target.closest("[data-grp]"); if(g){const code=g.dataset.grp,gr=GRP[code],st=groupState(d,code);
      if(st==="full"){d.countries=d.countries.filter(c=>!gr.members.includes(c));d.groupings=d.groupings.filter(x=>x!==code);}
      else{gr.members.forEach(m=>{if(!d.countries.includes(m))d.countries.push(m);});if(!d.groupings.includes(code))d.groupings.push(code);}
      d.groupings=d.groupings.filter(x=>groupState(d,x)!=="off");buildGroups();buildPicker();refreshRail();return;}
    const tg=e.target.closest("[data-tog]"); if(tg){const k=tg.dataset.tog,v=tg.dataset.v;
      d[k]=d[k].includes(v)?d[k].filter(x=>x!==v):d[k].concat(v);tg.setAttribute("aria-pressed",d[k].includes(v));
      if(k==="themes")buildBenef();refreshRail();return;}
    const ad=e.target.closest("[data-add]"); if(ad){const k=ad.dataset.add;
      d[k].push(k==="milestones"?{name:"",date:"",st:"PLANNED",desc:""}:k==="tools"?{iso:"",tool:""}:k==="docs"?{type:"PROJECT_DOC",name:"",url:""}:{type:"TRADEMARK",stage:"FILED",n:"",iso:""});
      buildRepeat();refreshRail();return;}
    const dl=e.target.closest("[data-del]"); if(dl){d[dl.dataset.del].splice(+dl.dataset.i,1);buildRepeat();refreshRail();return;}
    if(e.target.id==="tpl"){if(!d.desc.trim()||confirmReplace())d.desc=DESC_TEMPLATE;renderForm();return;}
    if(e.target.closest("[data-save]"))return save();
    if(e.target.id==="cancel"){const wasEdit=editing;draft=null;editing=null;if(wasEdit)go("db");else{renderForm();toast("Form cleared");}}
  };
}
let _tplArm=0;
function confirmReplace(){ if(Date.now()-_tplArm<4000)return true; _tplArm=Date.now(); toast("Press again to replace your description with the template."); return false; }

async function save(){
  const miss=missing(draft,DB);
  if(miss.length){toast("Still needed: "+miss.join(", "),true);return;}
  const btns=document.querySelectorAll("[data-save]"); btns.forEach(b=>{b.disabled=true;b.textContent="Saving…";});
  const payload=clone(draft); const base=payload._base; delete payload._base;
  const num=v=>v===""||v==null||isNaN(Number(v))?"":Number(v);

    <div class="fb grow"><label>&nbsp;</label><div class="muted" style="padding-bottom:6px">${live?"Today's position.":"As at "+niceDate(D)+": only milestones, starts and spend dated on or before then."}${DASH.fund?" "+set.length+" of "+DB.length+" records in scope.":""}</div></div>
  </div>
  <h2>Corporate indicators</h2>

    ${tile("ER 4.3",satAvg?satAvg+"%":"none yet",satDen?`participant satisfaction, ${fmt(satDen)} respondents. Target 90%.`:"no satisfaction scores recorded yet",satAvg,satAvg>=90?"ok":"")}

    ${tile("Spent","CHF "+fmt(spent),live?"latest figures entered":"as at "+niceDate(D),pct,pct>90?"warn":"ok")}
    ${tile("Remaining","CHF "+fmt(Math.max(0,alloc-spent)),pct+"% of the allocation used")}
    ${tile("No spend entered",set.filter(r=>!latestSpend(r)&&r.status!=="NOT_STARTED").length,"started records with no spend figure yet")}
  </div>
  <h2>Delivery</h2>
  <div class="tiles">
    ${tile("Beneficiaries",fmt(ben),"reported, of whom "+fmt(women)+" women")}
    ${tile("Countries reached",countries.size,"of 38 Asia-Pacific member states",countries.size/38*100,"")}
    ${tile("Started",started,"records under way or completed")}
    ${tile("Gaps flagged",gaps,"beneficiary figures not collected yet. Never counted as zero.")}
  </div>
  <div class="two">
    <div class="card"><h2>On track? Starts by quarter, ${Y}</h2>
      <div class="legrow"><span><span class="sw plan"></span>Planned to start</span><span><span class="sw act"></span>Actually started</span></div>
      <div class="qgrid">${QS.map((q,i)=>`<div class="bl">Q${i+1}</div><div class="qpair"><div class="qbar plan" style="width:${planned[i]/qmax*100}%" title="${planned[i]} planned"></div><div class="qbar act" style="width:${actual[i]/qmax*100}%" title="${actual[i]} started"></div></div><div class="bval">${actual[i]} of ${planned[i]}</div>`).join("")}</div>
      <p class="muted" style="margin:12px 0 0">Planned comes from each record's start date. Started means the start date has passed and the status has moved off Not started.</p></div>
    <div class="card"><h2>Portfolio buckets</h2>
      <div class="bars">${BUCKETS.map(([v,l])=>`<div class="bl">${esc(l)}</div><div class="btrack"><div class="bfill" style="width:${byB[v]/mxb*100}%"></div></div><div class="bval">${byB[v]}</div>`).join("")}</div>
      <h2 style="margin-top:20px">Records by Expected Result</h2>
      <div class="bars">${ER.filter(([v])=>byER[v]).map(([v])=>`<div class="bl">ER ${v}</div><div class="btrack"><div class="bfill" style="width:${byER[v]/mx*100}%"></div></div><div class="bval">${byER[v]}</div>`).join("")||'<div class="muted">No records.</div>'}</div></div>
  </div>
  <h2 style="margin-top:24px">Cross-regional work</h2>
  <div class="tiles">
    ${tile("Cross-regional records",cr.length,"tagged Cross Regional")}
    ${tile("Budget","CHF "+fmt(cr.reduce((a,r)=>a+Number(r.budget||0),0)),"CHF "+fmt(cr.reduce((a,r)=>a+spendAt(r,Q),0))+" spent")}
    ${tile("Beneficiaries",fmt(cr.reduce((a,r)=>a+total(r,"TOTAL"),0)),"reported")}
    ${tile("Countries",new Set(cr.flatMap(r=>r.countries||[])).size,"Asia-Pacific countries involved")}
  </div>
  ${cr.length?`<div class="tw" style="margin-bottom:18px"><table><thead><tr><th>ID</th><th>Project</th><th>Status</th><th>Manager</th><th>Budget</th><th>Spent</th></tr></thead><tbody>${cr.map(r=>`<tr class="clickable" data-view="${esc(r.id)}"><td class="idcell">${esc(r.id)}</td><td>${esc(r.title)}</td><td><span class="pill ${SCLASS[r.status]||""}"><span class="d"></span>${esc(L.status[r.status])}</span></td><td>${esc(uname(r.managerId))}</td><td class="num">${fmt(r.budget)}</td><td class="num">${fmt(spendAt(r,Q))}</td></tr>`).join("")}</tbody></table></div>`:""}
  <h2 style="margin-top:24px">ICDAP portfolio</h2>
  <div class="tiles">
    ${tile("ICDAP projects",ic.length,ic.filter(r=>r.status==="IN_PROGRESS").length+" in progress")}
    ${tile("Budget received","CHF "+fmt(icB),"allocated to ICDAP work")}
    ${tile("Budget used","CHF "+fmt(icS),icB?Math.round(icS/icB*100)+"% of the ICDAP allocation":"",icB?icS/icB*100:0,"")}
    ${tile("No project document",ic.filter(r=>!(r.docs||[]).some(x=>x.type==="PROJECT_DOC")).length,"ICDAP records without a linked project document")}
  </div>
  <p class="muted">The ICDAP panel always covers all ICDAP records, whatever the budget filter.</p>`;
  $("#dfund").onchange=e=>{DASH.fund=e.target.value;renderDash();};
  $("#dasof").onchange=e=>{DASH.asOf=e.target.value;renderDash();};
  $("#dashreport").onclick=openReport;
  $("#v-dash").onclick=e=>{const vw=e.target.closest("[data-view]");if(vw)openPanel(vw.dataset.view);};
}

/* ============================================================ WORD REPORT */
function reportData(q){
  const [qs,qe]=qRange(q), inQ=d=>d&&d>=qs&&d<=qe;
  const rows=[];
  DB.forEach(r=>{
    const ms=(r.milestones||[]).filter(m=>m.st==="ACHIEVED"&&inQ(m.date)).sort((a,b)=>a.date.localeCompare(b.date));
    const completed=r.status==="COMPLETED"&&inQ(r.end);
    if(ms.length||completed) rows.push({r,ms,completed});
  });
  rows.sort((a,b)=>(b.completed-a.completed)||a.r.title.localeCompare(b.r.title));
  const events=DB.filter(r=>r.type==="ACTIVITY"&&(inQ(r.start)||inQ(r.end))).sort((a,b)=>a.start.localeCompare(b.start));
  const trainings=DB.filter(r=>r.er==="4.3"&&r.satisfaction!==""&&r.satisfaction!=null&&Number(r.respondents)>0&&r.start<=qe&&(r.end||r.expEnd||qe)>=qs);
  const photos=rows.flatMap(x=>(x.r.docs||[]).filter(d=>d.type==="PHOTO"&&/^https?:/i.test(d.url)).map(d=>({d,r:x.r})));
  const stories=rows.filter(x=>x.completed&&x.r.sustainability);
  const nMs=rows.reduce((a,x)=>a+x.ms.length,0);
  return {q,qs,qe,rows,events,trainings,photos,stories,
    nCompleted:rows.filter(x=>x.completed).length, nMs, nProjects:rows.filter(x=>x.ms.length).length,
    msCompleted:rows.filter(x=>x.completed).reduce((a,x)=>a+x.ms.length,0), msOngoing:rows.filter(x=>!x.completed).reduce((a,x)=>a+x.ms.length,0)};
}

function openReport(){
  const opts=[];for(let q=CUR_Q,i=0;i<6;i++,q=qShift(q,-1))opts.push(q);
  const m=$("#modal");
  m.innerHTML=`<h3>Quarterly report</h3>
    <p class="muted" style="margin:0">A Word draft in the RNDS quarterly report format, built from the database. Sections MeTrack does not hold are marked in yellow for you to complete.</p>
    <div class="row"><label for="rq" style="font-size:13px;font-weight:600">Quarter</label><select id="rq" style="flex:1;min-width:0">${opts.map(q=>`<option value="${q}">${esc(qLabel(q))}</option>`).join("")}</select></div>
    <div id="rprev"></div>
    <div class="actions" style="justify-content:flex-end"><button class="btn ghost" id="rcancel">Cancel</button><button class="btn" id="rgo">Download Word report</button></div>`;
  const prev=()=>{const x=reportData($("#rq").value);
    $("#rprev").innerHTML=`<div class="stat"><span>Milestones achieved</span><b>${x.nMs}</b><span>Projects with milestones</span><b>${x.nProjects}</b><span>Projects completed</span><b>${x.nCompleted}</b><span>Events held</span><b>${x.events.length}</b><span>Trainings with satisfaction scores</span><b>${x.trainings.length}</b></div>`
      +(x.nMs||x.nCompleted?"":'<p class="muted" style="margin:-6px 0 12px">Nothing recorded for this quarter yet. The report will still download, with every section marked to complete.</p>');};
  $("#rq").onchange=prev; prev();
  $("#rcancel").onclick=closeModal;
  $("#rgo").onclick=async()=>{const b=$("#rgo");b.disabled=true;b.textContent="Building…";
    try{const blob=await buildReport(reportData($("#rq").value));saveBlob(blob,`DAP Quarterly Report ${qShort($("#rq").value)}.docx`);toast("Report downloaded");closeModal();}
    catch(e){console.error(e);toast("Could not build the Word file: "+e.message,true);b.disabled=false;b.textContent="Download Word report";}};
  m.classList.remove("hidden"); $("#scrim").classList.add("open");
}
function closeModal(){$("#modal").classList.add("hidden");if(!$("#panel").classList.contains("open"))$("#scrim").classList.remove("open");}
$("#reportbtn").onclick=openReport;

function buildReport(x){
  if(!window.docx) throw new Error("the Word library (lib/docx.min.js) did not load");
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,ShadingType,BorderStyle,LevelFormat,Footer,ExternalHyperlink}=window.docx;
  const BLUE="0070C0",PURPLE="A02B93",GREEN="3A7C22",FILL="D1D1D1";
  const T=(text,o={})=>new TextRun(Object.assign({text:String(text)},o));
  const P=(children,o={})=>new Paragraph(Object.assign({children:Array.isArray(children)?children:[children],spacing:{after:120}},o));
  const todo=text=>T(text,{shading:{type:ShadingType.CLEAR,fill:"FFFF00",color:"auto"}});   // yellow marker; w:highlight via docx-js emits a non-schema highlightCs
  const sec=t=>P(T(t,{bold:true,color:BLUE}),{numbering:{reference:"sec",level:0},spacing:{before:240,after:120},keepNext:true});
  const sub=(t,inst)=>P(T(t,{bold:true,color:PURPLE}),{numbering:{reference:"sub",level:0,instance:inst},spacing:{before:200,after:100},keepNext:true});
  const bullet=(children,lvl=0)=>body.push(P(children,{numbering:{reference:"bul",level:lvl},spacing:{after:80}}));
  const div=`[${DIVISION}]`;
  const qn=x.q.slice(-1);
  const period=r=>niceRange(r.start,r.end||r.expEnd);
  const body=[];

  body.push(P(todo(`Draft generated from MeTrack on ${niceDate(todayISO())}. Complete the sections in yellow and delete this line before submitting.`),{spacing:{after:240}}));
  body.push(P(T("QUARTERLY REPORT",{bold:true}),{alignment:AlignmentType.CENTER,spacing:{after:0}}));
  body.push(P(T("Regional and National Development Sector",{bold:true}),{alignment:AlignmentType.CENTER,spacing:{after:360}}));
  body.push(P(T("[Department of Development Cooperation]",{bold:true}),{spacing:{after:0}}));
  body.push(P(T(div,{bold:true}),{spacing:{after:240}}));
  body.push(P([T("Period: ",{bold:true}),T(qLabel(x.q),{bold:true,underline:{}})],{spacing:{after:240}}));
  body.push(P(T("Brief Highlights",{bold:true})));

  body.push(sec("Progress towards mandate implementation"));
  body.push(sub("Project milestones/sustainability",1));
  body.push(P([T(div+" ",{bold:true}),T(`(${x.nCompleted} project${x.nCompleted===1?"":"s"} completed and ${x.nMs} milestone${x.nMs===1?"":"s"} achieved across ${x.nProjects} project${x.nProjects===1?"":"s"})`,{bold:true})]));
  const projectBullets=list=>list.forEach(({r,ms,completed})=>{
    const head=`${r.title} (${ms.length} milestone${ms.length===1?"":"s"} achieved${completed?", project completed "+niceDate(r.end):""})`;
    bullet([T(head,{bold:true,underline:{}}),T(":")]);
    if(ms.length) ms.forEach(m=>bullet([T(m.name+", "+niceDate(m.date)+". ",{bold:true}),T(m.desc||"",{italics:!m.desc}),...(m.desc?[]:[todo("Add a description of this milestone.")])],1));
    else bullet([todo("No milestone recorded this quarter. Add the final deliverables.")],1);
  });
  const comp=x.rows.filter(y=>y.completed), ong=x.rows.filter(y=>!y.completed);
  body.push(P(T(`Completed Projects (${x.msCompleted} completed milestone${x.msCompleted===1?"":"s"}):`,{bold:true,color:GREEN}),{spacing:{before:120,after:80}}));
  if(comp.length) projectBullets(comp); else bullet([T("None this quarter.",{italics:true})]);
  body.push(P(T(`Ongoing Projects (${x.msOngoing} completed milestone${x.msOngoing===1?"":"s"}):`,{bold:true,color:GREEN}),{spacing:{before:160,after:80}}));
  if(ong.length) projectBullets(ong); else bullet([T("No milestones recorded this quarter.",{italics:true})]);

  body.push(sub("Highlights on IP trainings (WIPO Academy)",1));
  if(x.trainings.length) x.trainings.forEach(r=>bullet([T(r.title,{bold:true}),T(`: ${r.satisfaction}% of ${r.respondents} respondents satisfied or very satisfied.`)]));
  else body.push(P(T("N/A")));

  body.push(sub("High-level meetings / Conferences / Committees",1));
  body.push(P([T(div+" ",{bold:true}),T(`(${x.events.length} event${x.events.length===1?"":"s"} recorded in MeTrack):`,{bold:true})]));
  x.events.forEach(r=>{const n=total(r,"TOTAL"),q=(r.benef||[]).find(b=>b.seg==="TOTAL"&&b.rs==="REPORTED"),c=(r.countries||[]).length;
    const ach=(r.milestones||[]).find(m=>m.st==="ACHIEVED"&&m.desc);
    bullet([T(`${r.title} (${period(r)})`,{bold:true,underline:{}}),T(`: ${n?(q&&q.q==="MINIMUM"?"at least ":q&&q.q==="ESTIMATE"?"an estimated ":"")+fmt(n)+" participants from ":"participants from "}${c} ${c===1?"country":"countries"}.`),...(ach?[T(" Key outcomes: ",{italics:true}),T(ach.desc)]:[])]);});
  body.push(P(todo("Add any meetings, conferences or committees not recorded in MeTrack.")));

  body.push(sub("High-level mission by DG, DDG, Senior Director",1));
  body.push(P([T(div+" ",{bold:true}),todo("(Insert number of missions): name, place, dates, counterparts met and key outcomes. MeTrack does not record missions.")]));
  body.push(sub("New cooperation requests",1));
  body.push(P([T(div+" ",{bold:true}),todo("(Insert number of new requests): requesting country, authority and subject. MeTrack does not record requests.")]));
  body.push(sub("Beneficiary Impact Stories/Communications related Deliverables",1));
  body.push(P(T(div,{bold:true})));
  x.stories.forEach(({r})=>bullet([T(r.title,{bold:true}),T(": "+r.sustainability)]));
  body.push(P(todo("Add impact stories with their IP Advantage links.")));

  body.push(sec("Annexes"));
  body.push(sub("Table with summary of quarter's activities",2));
  body.push(P(T(div,{bold:true}),{keepNext:true}));
  const W=[600,2900,2226,3300], TW=W.reduce((a,b)=>a+b,0);
  const border={style:BorderStyle.SINGLE,size:4,color:"808080"}, borders={top:border,bottom:border,left:border,right:border};
  const C=(paras,w,head)=>new TableCell({width:{size:w,type:WidthType.DXA},borders,margins:{top:60,bottom:60,left:100,right:100},
    shading:head?{fill:FILL,type:ShadingType.CLEAR,color:"auto"}:undefined,children:paras});
  const cp=(runs)=>new Paragraph({children:Array.isArray(runs)?runs:[runs],spacing:{after:60}});
  const hdr=["No.","Project",`Number of milestones achieved, or projects completed during Q${qn}`,"Describe the milestone achieved or final deliverables of the completed project (50 -100 words)"];
  const trs=[new TableRow({tableHeader:true,children:hdr.map((h,i)=>C([cp(T(h,{bold:true,size:20}))],W[i],true))})];
  x.rows.forEach((y,i)=>{
    const c3=[cp(T(`${y.ms.length} milestone${y.ms.length===1?"":"s"} achieved${y.completed?"; project completed":""}`,{bold:true,size:20}))].concat(y.ms.map(m=>cp(T(`${m.name} (${niceDate(m.date)})`,{size:20}))));
    const c4=y.ms.length?y.ms.map(m=>cp(m.desc?T(m.desc,{size:20}):todo("Add a 50 to 100 word description."))):[cp(todo("Describe the final deliverables of the completed project."))];
    trs.push(new TableRow({children:[C([cp(T(String(i+1),{size:20}))],W[0]),C([cp(T(y.r.inWorkplan&&y.r.workplanTitle?y.r.workplanTitle:y.r.title,{size:20}))],W[1]),C(c3,W[2]),C(c4,W[3])]}));
  });
  if(!x.rows.length) trs.push(new TableRow({children:[C([cp(T("1",{size:20}))],W[0]),C([cp(todo("No milestones recorded for this quarter."))],W[1]),C([cp(T(""))],W[2]),C([cp(T(""))],W[3])]}));
  body.push(new Table({width:{size:TW,type:WidthType.DXA},columnWidths:W,rows:trs}));

  body.push(sub("Pictures",2));
  body.push(P(T(div,{bold:true})));
  x.photos.forEach(({d,r})=>bullet([new ExternalHyperlink({link:d.url,children:[T(d.name||d.url,{color:"0563C1",underline:{}})]}),T(" ("+r.title+")")]));
  body.push(P(todo("Insert pictures with captions: event, place, date and the people shown.")));
  body.push(P(T("[End]",{bold:true}),{alignment:AlignmentType.CENTER,spacing:{before:360}}));

  const doc=new Document({
    creator:"MeTrack", title:`${DIVISION} quarterly report ${qShort(x.q)}`,
    styles:{default:{document:{run:{font:"Arial",size:22}}}},
    numbering:{config:[
      {reference:"sec",levels:[{level:0,format:LevelFormat.DECIMAL,text:"%1.",alignment:AlignmentType.LEFT,style:{paragraph:{indent:{left:360,hanging:360}}}}]},
      {reference:"sub",levels:[{level:0,format:LevelFormat.LOWER_ROMAN,text:"%1.",alignment:AlignmentType.RIGHT,style:{paragraph:{indent:{left:900,hanging:300}}}}]},
      {reference:"bul",levels:[
        {level:0,format:LevelFormat.BULLET,text:"•",alignment:AlignmentType.LEFT,style:{paragraph:{indent:{left:1080,hanging:360}}}},
        {level:1,format:LevelFormat.BULLET,text:"◦",alignment:AlignmentType.LEFT,style:{paragraph:{indent:{left:1440,hanging:360}}}}]}]},
    sections:[{
      properties:{page:{size:{width:11906,height:16838},margin:{top:1440,right:1440,bottom:1440,left:1440}}},
      footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER,children:[T("WIPO FOR OFFICIAL USE ONLY",{size:16})]})]})},
      children:body}]});
  return Packer.toBlob(doc);
}

const VIEWS={form:renderForm,dash:renderDash,db:renderDB};
function go(v){
  VIEW=v; Object.keys(VIEWS).forEach(k=>$("#v-"+k).classList.toggle("hidden",k!==v));
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.v===v)));
  VIEWS[v](); window.scrollTo(0,0);
}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.v==="form"&&editing){editing=null;draft=null;}
  go(b.dataset.v);};

function applyTheme(){const t=(store.get("metrack.theme"))||"";if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");syncTheme();}
function isDark(){const a=document.documentElement.getAttribute("data-theme");return a?a==="dark":window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;}
function syncTheme(){$("#theme").textContent=isDark()?"Light":"Dark";}
try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncTheme);}catch(e){}
$("#theme").onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("metrack.theme",JSON.stringify(t));}catch(e){}syncTheme();};
store.get=(k=>function(key){if(key==="metrack.theme"){try{return JSON.parse(localStorage.getItem(key));}catch(e){return null;}}return k(key);})(store.get);

boot();
